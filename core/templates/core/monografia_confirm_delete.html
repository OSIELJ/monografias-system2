{% extends "base.html" %}
{% block content %}
<h2>Confirmar exclusão</h2>
<p>Deseja realmente excluir a monografia <strong>{{ monografia.titulo }}</strong>?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Sim, excluir</button>
    <a href="{% url 'monografia_list' %}">Cancelar</a>
</form>
{% endblock %}
